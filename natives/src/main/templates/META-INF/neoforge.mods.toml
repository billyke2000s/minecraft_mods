modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="billyke2000s"
# Adds a new mob, so players need it too (AutoModpack syncs it).
description='''
Biome-specific native tribes living in camps. Trade with them to form an alliance, conquer them by
defeating their chief, and claim the land with a Colony Flag. Anger them and they may fight back.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
