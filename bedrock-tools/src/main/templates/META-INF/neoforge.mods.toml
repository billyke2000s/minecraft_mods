modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="billyke2000s"
# Server-side only: players without the mod can join.
displayTest="IGNORE_SERVER_VERSION"
description='''
Unbreakable bedrock-textured netherite tools with huge stats, crafted from bedrock.
Server-side: the textures arrive as a resource pack when players join.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
