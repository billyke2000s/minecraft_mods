modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="billyke2000s"
# Server-side only: labels are ordinary entities, so vanilla clients see them without the mod.
displayTest="IGNORE_ALL_VERSION"
description='''
Companion to Damage Health: shows the same compact red heart and hearts-left label above every
injured mob, not just players.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
